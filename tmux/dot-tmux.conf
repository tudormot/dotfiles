# Increase length of left part of bottom bar (which is holding the session name)
set -g status-left-length 20

# Fix the "Escape" key delay in Vim (crucial for Vim users) and enable CSI-u extended keys
set -sg escape-time 0
set -s extended-keys on

# Enable mouse support for resizing and scrolling
set -g mouse on

# Increase scrollback buffer
set -g history-limit 50000

# Set the prefix to Ctrl-a (C-a C-a sends literal C-a to inner apps like Neovim)
unbind C-b
unbind 'C-\'
set-option -g prefix C-a
bind-key C-a send-prefix

# --- COLORS, CLIPBOARD, FOCUS & PANE DIMMING ---
# Use tmux-256color for proper italics and modern terminal capabilities
set -g default-terminal "tmux-256color"
set -g focus-events on

# Allow copy pasting from vim via OSC52 (including over mosh/gmosh)
set -s set-clipboard on
set -g allow-passthrough on

# Reset terminal-overrides before appending so reloading tmux.conf never stacks duplicates
set -su terminal-overrides
set -as terminal-overrides ",*:Ms=\\E]52;c%p1%.0s;%p2%s\\007"
set -as terminal-overrides ",*:Tc"

# --- GRUVBOX MATERIAL MEDIUM DARK THEME (Pane Dimming, Borders & Status Bar) ---
# Active pane inherits Alacritty's bg0 (#282828); unfocused dims to bg_dim (#1b1b1b),
# matching Neovim gruvbox-material's NormalNC bg_dim pixel-for-pixel.
set -gw window-style "fg=#928374,bg=#1b1b1b"
set -gw window-active-style "fg=terminal,bg=terminal"
set -gw pane-border-style "fg=#45403d"
set -gw pane-active-border-style "fg=#d8a657"

# Status bar (bg_dim base, muted olive green / aqua-blue prefix cue)
set -g status-style "bg=#1b1b1b,fg=#928374"
set -g status-left "#{?client_prefix,#[bg=#7daea3 fg=#1b1b1b bold],#[bg=#a9b665 fg=#1b1b1b bold]} #S #[default] "
set -g status-right-length 45
set -g status-right-style "bg=#1b1b1b,fg=#7c6f64"
# No date/time (already in Waybar); clearly highlight SSH vs LOCAL
set -g status-right "#{?SSH_CONNECTION,#[bg=#e78a4e fg=#1b1b1b bold] 󰣀 SSH: #h #[default],#{?#{m/r:^(ssh|rw|mosh-client)$,#{pane_current_command}},#[bg=#d8a657 fg=#1b1b1b bold] 󰣀 #h → #{pane_current_command} #[default],#[bg=#32302f fg=#a9b665] 󰌢 LOCAL: #h #[default]}}"
set -gw window-status-style "bg=#1b1b1b,fg=#7c6f64"
set -gw window-status-current-style "bg=#32302f,fg=#d4be98,bold"
set -gw window-status-format " #I:#W#{?window_flags,#{window_flags},} "
set -gw window-status-current-format " #I:#W#{?window_flags,#{window_flags},} "
set -gw window-status-separator ""
set -gw window-status-activity-style "bg=#1b1b1b,fg=#ea6962"
set -gw window-status-bell-style "bg=#1b1b1b,fg=#ea6962,bold"
set -g message-style "bg=#32302f,fg=#d8a657"
set -g message-command-style "bg=#32302f,fg=#7daea3"
set -gw mode-style "bg=#d8a657,fg=#1b1b1b"

# --- VIM-STYLE NAVIGATION (Seamless Ctrl-h/j/k/l across Neovim & tmux) ---
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind-key -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind-key -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind-key -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"

# Restore clear-screen via Prefix + Ctrl-l (since bare Ctrl-l moves right)
bind-key C-l send-keys 'C-l'

# Keep Prefix + h/j/k/l as fallback
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Use Alt-hjkl (with prefix, repeatable) to resize panes
bind -r M-h resize-pane -L 5
bind -r M-j resize-pane -D 5
bind -r M-k resize-pane -U 5
bind -r M-l resize-pane -R 5

# --- COPY MODE (Vim Mode) ---
# Enter copy-mode directly with Alt-[ (no prefix needed; Prefix + [ also still works)
bind-key -n 'M-[' copy-mode

# Use Vim keybindings in copy mode
set-window-option -g mode-keys vi

# Allow seamless Ctrl-h/j/k/l out of copy-mode panes too
bind-key -T copy-mode-vi C-h select-pane -L
bind-key -T copy-mode-vi C-j select-pane -D
bind-key -T copy-mode-vi C-k select-pane -U
bind-key -T copy-mode-vi C-l select-pane -R

# Use 'v' to begin selection and 'y' to yank (like Vim)
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection

# Update the default binding of 'Enter' to use copy-selection-and-cancel
# https://tmuxai.dev/tmux-vim-mode/
# unbind-key -T copy-mode-vi Enter
# bind-key -T copy-mode-vi Enter send-keys -X copy-selection-and-cancel

# --- SPLITTING WINDOWS ---
# Open new panes in the current directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# --- PLUGINS ---
# plugins that allow session persistence through system shutdown
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'

# keep this at the end of the conf file:
run '~/.tmux/plugins/tpm/tpm'
