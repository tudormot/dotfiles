[general]
import = [
    "~/.config/alacritty/themes/themes/gruvbox_material_medium_dark.toml"
]

# Fix quirk in the vendored gruvbox_material_medium_dark.toml theme, which copies
# normal.black (#3c3836) into bright.black (~1.3:1 contrast on #282828), making
# ANSI color 8 / dim text (e.g. Jetski hints & thinking, fzf, git) barely readable.
# Override with official Gruvbox Material muted gray (grey1 = #928374, grey0 = #7c6f64).
[colors.primary]
dim_foreground = "#928374"

[colors.bright]
black = "#928374"

[colors.dim]
black = "#7c6f64"

# allows OSC52 for copy to clipboard from ssh
[selection]
save_to_clipboard = true

[keyboard]
bindings = [
    { key = "Q", mods = "Control", action = "Quit" },
    { key = "+", mods = "Control|Shift", action = "IncreaseFontSize" }
]

[window]
padding = { x = 5, y = 5 }
dynamic_padding = true
opacity = 1.0  # 0.0 is transparent, 1.0 is opaque

[font]
size = 10.5

[font.bold]
family = "JetBrainsMono Nerd Font Mono"
style = "Bold"

[font.bold_italic]
family = "JetBrainsMono Nerd Font Mono"
style = "Bold Italic"

[font.italic]
family = "JetBrainsMono Nerd Font Mono"
style = "Italic"

[font.normal]
family = "JetBrainsMono Nerd Font Mono"
style = "Regular"
